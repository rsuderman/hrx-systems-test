name: Temporary schedule delivery probe

# Diagnose delivery only; remove after comparing these two schedule rules.
on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '1-59/5 * * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:

permissions: {}

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record scheduler delivery
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          printf 'event=%s\ncron=%s\nobserved_utc=%s\n' \
            "$EVENT_NAME" "${EVENT_SCHEDULE:-manual}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
