name: Cached-model verification
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      runtime_source:
        description: Both latest SDKs, one latest SDK, or an exact pinned/replay diagnostic
        type: choice
        options: [both, release-latest, actions-main, release, actions-replay]
        default: both
      runtime_run_id:
        description: Replay only - upstream Actions run ID
        type: string
      runtime_run_attempt:
        description: Replay only - upstream run attempt
        type: string
      runtime_artifact_id:
        description: Replay only - upstream artifact ID
        type: string
      runtime_wheel_sha256:
        description: Replay only - exact wheel SHA256 from saved provenance
        type: string
      full_integrity:
        description: Rehash each distinct cached asset once instead of trusting unchanged writer receipts
        type: boolean
        default: false
      selection:
        description: Explicit proven suite or all selections seeded on this runner
        type: choice
        options: [suite, cached]
        default: cached
      device_uri:
        description: Explicit device for the operator-selected compatible suite
        type: string
        default: amdgpu://0
      cycles:
        description: Load/query/unload cycles per test entry
        type: number
        default: 2
permissions:
  contents: read
# Keep the hardware lock on the outer pair, never on its called worker.
concurrency:
  group: hrx-single-model-hardware
  cancel-in-progress: false
jobs:
  plan:
    name: Freeze common inventory and both runtime selections
    runs-on: [self-hosted, linux, hrx-systems-test-bootstrap]
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.resolve.outputs.ready == 'true' && steps.upload_plan.outcome == 'success' }}
      first_lane: ${{ steps.resolve.outputs.first_lane }}
      second_lane: ${{ steps.resolve.outputs.second_lane }}
    env:
      CONFIGURED_CACHE_ROOT: ${{ vars.HRX_SYSTEMS_ROOT }}
      RAW_DISPATCH_INPUTS: ${{ toJSON(inputs) }}
      PYTHONNOUSERSITE: '1'
      PYTHONPATH: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Freeze comparison plan
        id: resolve
        env:
          HRX_ACTIONS_TOKEN: ${{ secrets.HRX_ACTIONS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          root="${CONFIGURED_CACHE_ROOT:-${HRX_SYSTEMS_ROOT:-$HOME/.local/share/hrx-systems-test}}"
          base="$RUNNER_TEMP/hrx-model-tests/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$base"
          python3 -I - "$base/dispatch-inputs.json" <<'PYTHON'
          import json,os,pathlib,sys
          value=json.loads(os.environ.get('RAW_DISPATCH_INPUTS') or '{}')
          pathlib.Path(sys.argv[1]).write_text(json.dumps(value or {}))
          PYTHON
          python3 -u -I scripts/paired-ci.py plan --root "$root" --output "$base/plan" \
            --inputs "$base/dispatch-inputs.json" --event "$GITHUB_EVENT_NAME" --github-output "$GITHUB_OUTPUT"
      - name: Upload frozen plan
        id: upload_plan
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: model-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hrx-model-tests/${{ github.run_id }}-${{ github.run_attempt }}/plan/
          if-no-files-found: error
          retention-days: 7
  first:
    name: Verify ${{ needs.plan.outputs.first_lane }}
    needs: plan
    if: ${{ always() && !cancelled() && needs.plan.outputs.ready == 'true' }}
    uses: ./.github/workflows/_model-verification-worker.yml
    with:
      lane_id: ${{ needs.plan.outputs.first_lane }}
    secrets:
      HRX_ACTIONS_TOKEN: ${{ secrets.HRX_ACTIONS_TOKEN }}
  second:
    name: Verify ${{ needs.plan.outputs.second_lane }}
    needs: [plan, first]
    if: ${{ always() && !cancelled() && needs.plan.outputs.ready == 'true' && needs.plan.outputs.second_lane != '' }}
    uses: ./.github/workflows/_model-verification-worker.yml
    with:
      lane_id: ${{ needs.plan.outputs.second_lane }}
      previous_cleanup_safe: ${{ needs.first.outputs.cleanup_safe == 'true' && 'true' || 'false' }}
    secrets:
      HRX_ACTIONS_TOKEN: ${{ secrets.HRX_ACTIONS_TOKEN }}
  comparison:
    name: Report both runtime results
    needs: [plan, first, second]
    if: always()
    runs-on: [self-hosted, linux, hrx-systems-test-bootstrap]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download frozen plan
        if: ${{ needs.plan.outputs.ready == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: model-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hrx-model-comparison/${{ github.run_id }}-${{ github.run_attempt }}/plan
      - name: Download all retained lane results
        if: ${{ needs.plan.outputs.ready == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: model-lane-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hrx-model-comparison/${{ github.run_id }}-${{ github.run_attempt }}/results
      - name: Aggregate comparison without hiding lane failures
        id: aggregate
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/hrx-model-comparison/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$base/summary" "$base/results"
          if [[ ! -f "$base/plan/ci-plan.json" ]]; then
            printf '# Verification incomplete\n\nThe frozen comparison plan was not retained. No verified paired result is available.\n' > "$base/summary/summary.md"
            printf '{"schema_version":1,"status":"failed","reason":"frozen plan unavailable"}\n' > "$base/summary/paired-result.json"
            exit 1
          fi
          python3 -I scripts/paired-ci.py aggregate --plan "$base/plan/ci-plan.json" \
            --results "$base/results" --output "$base/summary"
      - name: Upload combined comparison
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: model-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hrx-model-comparison/${{ github.run_id }}-${{ github.run_attempt }}/summary/
          if-no-files-found: error
          retention-days: 7
      - name: Publish combined summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          summary="$RUNNER_TEMP/hrx-model-comparison/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/summary/summary.md"
          if [[ -f "$summary" ]]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Require both requested lanes and publication
        if: always()
        shell: bash
        env:
          PLAN_READY: ${{ needs.plan.outputs.ready }}
          AGGREGATE_OUTCOME: ${{ steps.aggregate.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          [[ "$PLAN_READY" = true && "$AGGREGATE_OUTCOME" = success && "$UPLOAD_OUTCOME" = success ]]
