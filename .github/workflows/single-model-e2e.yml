name: Cached-model verification
on:
  workflow_dispatch:
    inputs:
      device_uri:
        description: Explicit device for the operator-selected compatible suite
        type: string
        default: amdgpu://0
      cycles:
        description: Load/query/unload cycles per test entry
        type: number
        default: 2
permissions:
  contents: read
concurrency:
  group: hrx-single-model-hardware
  cancel-in-progress: false
jobs:
  verify:
    runs-on: [self-hosted, linux, hrx-systems-test-bootstrap]
    # Covers the current one-model suite and artifact/cleanup time. Review as the suite grows.
    timeout-minutes: 60
    env:
      CONFIGURED_CACHE_ROOT: ${{ vars.HRX_SYSTEMS_ROOT }}
      DEVICE_URI: ${{ inputs.device_uri }}
      TEST_CYCLES: ${{ inputs.cycles }}
      PYTHONNOUSERSITE: '1'
      PYTHONPATH: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Initialize runner-owned attempt and workflow identity
        id: initialize
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/hrx-model-tests/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$(dirname -- "$output")"
          mkdir -- "$output"
          printf 'E2E_OUTPUT=%s\n' "$output" >> "$GITHUB_ENV"
          python3 -I - "$output/workflow.json" <<'PY'
          import json, os, pathlib, sys
          names = {'repository': 'GITHUB_REPOSITORY', 'run_id': 'GITHUB_RUN_ID',
                   'run_attempt': 'GITHUB_RUN_ATTEMPT', 'ref': 'GITHUB_REF',
                   'sha': 'GITHUB_SHA', 'runner': 'RUNNER_NAME'}
          identity = {'schema_version': 1, **{key: os.environ[name] for key, name in names.items()}}
          identity['run_url'] = f"{os.environ['GITHUB_SERVER_URL']}/{identity['repository']}/actions/runs/{identity['run_id']}"
          pathlib.Path(sys.argv[1]).write_text(json.dumps(identity, indent=2) + '\n')
          PY
      - name: Prepare fresh pipelines and read-only cached assets
        id: prepare
        if: ${{ !cancelled() && steps.initialize.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          root="${CONFIGURED_CACHE_ROOT:-${HRX_SYSTEMS_ROOT:-$HOME/.local/share/hrx-systems-test}}"
          bash scripts/prepare-cached-models.sh --root "$root" --output "$E2E_OUTPUT/prepared" >"$E2E_OUTPUT/prepare.log" 2>&1
      - name: Run the prepared suite offline through one server
        id: run
        if: ${{ !cancelled() && steps.initialize.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$E2E_OUTPUT/prepared/prepared-suite.json" ]]; then
            echo 'No usable prepared manifest; no server started.' >&2
            exit 1
          fi
          bash scripts/run-prepared-models.sh --prepared "$E2E_OUTPUT/prepared" \
            --output "$E2E_OUTPUT/results" --workflow "$E2E_OUTPUT/workflow.json" \
            --device-uri "$DEVICE_URI" --cycles "$TEST_CYCLES" >"$E2E_OUTPUT/run.log" 2>&1
      - name: Confirm execution-owned container cleanup
        id: cleanup
        if: ${{ always() && steps.initialize.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run-prepared-models.sh --cleanup --output "$E2E_OUTPUT/results" >"$E2E_OUTPUT/cleanup.log" 2>&1
      - name: Generate verification artifacts from saved results
        id: report
        if: ${{ always() && steps.initialize.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$E2E_OUTPUT/results/suite-result.json" ]]; then
            echo 'No raw results; retaining preparation/execution diagnostics.' >&2
            exit 1
          fi
          bash scripts/generate-model-report.sh --results "$E2E_OUTPUT/results" --output "$E2E_OUTPUT/report" >"$E2E_OUTPUT/report.log" 2>&1
      - name: Save stage outcomes and publish readable summary
        if: ${{ always() && steps.initialize.outcome == 'success' }}
        shell: bash
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          RUN_OUTCOME: ${{ steps.run.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
        run: |
          set -euo pipefail
          python3 -I - "$E2E_OUTPUT/stages.json" <<'PY'
          import json, os, pathlib, sys
          names = ('prepare', 'run', 'cleanup', 'report')
          statuses = {name: os.environ[name.upper() + '_OUTCOME'] for name in names}
          pathlib.Path(sys.argv[1]).write_text(json.dumps({'schema_version': 1, 'stages': statuses}, indent=2) + '\n')
          PY
          if [[ -f "$E2E_OUTPUT/report/summary.md" ]]; then
            cat "$E2E_OUTPUT/report/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## Verification incomplete\n\nNo rendered report was produced. Inspect the uploaded stage diagnostics.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\n| Stage | Outcome |\n|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          for stage in prepare run cleanup report; do
            variable="${stage^^}_OUTCOME"
            printf '| %s | %s |\n' "$stage" "${!variable}" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload compact report and available failure evidence
        id: upload
        if: ${{ always() && steps.initialize.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: model-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.E2E_OUTPUT }}/workflow.json
            ${{ env.E2E_OUTPUT }}/stages.json
            ${{ env.E2E_OUTPUT }}/prepare.log
            ${{ env.E2E_OUTPUT }}/run.log
            ${{ env.E2E_OUTPUT }}/cleanup.log
            ${{ env.E2E_OUTPUT }}/report.log
            ${{ env.E2E_OUTPUT }}/report/
            ${{ env.E2E_OUTPUT }}/results/suite-result.json
            ${{ env.E2E_OUTPUT }}/results/server.log
            ${{ env.E2E_OUTPUT }}/results/container.log
            ${{ env.E2E_OUTPUT }}/results/workflow.json
            ${{ env.E2E_OUTPUT }}/results/sdk-runtime/sdk.json
            ${{ env.E2E_OUTPUT }}/results/models/*/serve-result.json
            ${{ env.E2E_OUTPUT }}/results/models/*/prepared-inputs.json
            ${{ env.E2E_OUTPUT }}/results/models/*/seed-manifest.json
            ${{ env.E2E_OUTPUT }}/results/models/*/online.log
            ${{ env.E2E_OUTPUT }}/results/models/*/offline.log
            ${{ env.E2E_OUTPUT }}/results/models/*/sdk-online/sdk.json
            ${{ env.E2E_OUTPUT }}/results/models/*/sdk-offline/sdk.json
            ${{ env.E2E_OUTPUT }}/results/models/*/cycle-*/request.json
            ${{ env.E2E_OUTPUT }}/results/models/*/cycle-*/response.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove disposable prepared inputs after confirmed cleanup
        if: ${{ always() && steps.initialize.outcome == 'success' && steps.cleanup.outcome == 'success' }}
        shell: bash
        run: rm -rf -- "$E2E_OUTPUT/prepared"
      - name: Require all stages and publication to pass
        if: always()
        shell: bash
        env:
          INITIALIZE_OUTCOME: ${{ steps.initialize.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          RUN_OUTCOME: ${{ steps.run.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          for stage in INITIALIZE PREPARE RUN CLEANUP REPORT UPLOAD; do
            variable="${stage}_OUTCOME"
            [[ "${!variable}" = success ]] || { echo "$stage did not pass: ${!variable}" >&2; exit 1; }
          done
